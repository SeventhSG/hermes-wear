android.useAndroidX=true
android.nonTransitiveRClass=true
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/35.0.0/aapt2

# Branding: change these to rebrand a build (users can still override name, logo, theme and accent in Settings > Appearance).
#   brand.label  launcher and app label
#   brand.name   what the Hermes agent is called in chat ("" keeps "Hermes")
#   brand.theme  default theme id: console, console-light, refined, refined-light, oled, ember, violet, nord, forest, sky, sage, custom
#   brand.background  background of the "custom" theme, hex (e.g. 101418)
#   brand.accent default accent colour, hex (e.g. 4f8ff7); empty keeps the theme's own
# Logo: put an image at app/src/main/res/drawable-nodpi/brand_logo.png (any square image) to replace the built-in mark.
# Launcher icon: replace app/src/main/res/mipmap-*/ic_launcher*.
brand.label=Hermes
brand.name=
brand.theme=console
brand.background=101418
brand.accent=
