plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing comes from the environment so no key ever lives in the repo.
def ks = System.getenv('HERMES_WEAR_KEYSTORE')
def ksPass = System.getenv('HERMES_WEAR_STORE_PASSWORD')
def ksAlias = System.getenv('HERMES_WEAR_KEY_ALIAS')
def ksKeyPass = System.getenv('HERMES_WEAR_KEY_PASSWORD')
def hasSigning = ks && ksPass && ksAlias && ksKeyPass

android {
    namespace 'com.seventhsg.hermeswear'
    compileSdk 35

    defaultConfig {
        applicationId 'com.seventhsg.hermeswear'
        minSdk 30
        targetSdk 35
        versionCode 162
        versionName '7.77.0'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ks)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
}
